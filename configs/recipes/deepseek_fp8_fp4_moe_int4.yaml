version: 1

model:
  input_path: /path/to/input_model
  output_path: /path/to/output_model
  format: hf_safetensors

backend:
  name: cpu
  fallback_policy: warn
  op_placement:
    fp4_dequant: device
    fp8_dequant: device
    mse_int4_quant: device
    int4_pack: auto
    safetensors_io: cpu

discover:
  auto_pair_scales: true

module_groups:
  moe_experts:
    include:
      - ".*\\.experts\\.\\d+\\.(gate_proj|up_proj|down_proj|w1|w2|w3)\\.weight$"
    exclude:
      - ".*shared_experts.*"

  moe_shared_experts:
    include:
      - ".*shared_experts.*\\.(gate_proj|up_proj|down_proj|w1|w2|w3)\\.weight$"

  scaled_dense:
    selector:
      has_scale: true
    exclude_groups:
      - moe_experts
      - moe_shared_experts

rules:
  - name: moe_fp4_to_int4
    group: moe_experts
    when:
      source_format: fp4_e2m1_e8m0
    transform: fp4_to_int4
    quantizer:
      name: mse
      group_size: 32
      n_candidates: 200
    output:
      scale_suffix: ".scale"

  - name: shared_fp4_to_bf16
    group: moe_shared_experts
    when:
      source_format: fp4_e2m1_e8m0
    transform: fp4_to_bf16

  - name: scaled_fp8_to_bf16
    group: scaled_dense
    when:
      has_scale: true
    transform: fp8_to_bf16
    params:
      block_size: 128

calibration:
  enabled: false
  dataset_jsonl: null
  output_dir: null
  max_length: 2048
  batch_size: 1
  collect:
    groups:
      - moe_experts
    stats:
      - hessian
      - act_scales

