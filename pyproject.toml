[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flagos-compressor"
version = "0.1.0"
description = "FlagOS-Compressor: model-agnostic checkpoint conversion and INT4/INT8 quantization."
requires-python = ">=3.10"
dependencies = [
  "torch",
  "safetensors",
  "tqdm",
  "PyYAML",
]


[project.scripts]
flagos-compressor = "flagos_compressor.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
