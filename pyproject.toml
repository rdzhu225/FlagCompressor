[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-engine"
version = "0.1.0"
description = "Lightweight FP8/BF16 and FP4-MoE/INT4 checkpoint conversion engine."
requires-python = ">=3.10"
dependencies = [
  "torch",
  "safetensors",
  "tqdm",
]


[project.scripts]
quant-engine = "quant_engine.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

