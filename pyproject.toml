[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flag-compressor"
version = "0.1.0"
description = "FlagCompressor: model-agnostic FP8/FP4 to BF16 checkpoint dequantizer."
requires-python = ">=3.10"
dependencies = [
  "torch",
  "safetensors",
  "tqdm",
]


[project.scripts]
flag-compressor = "flag_compressor.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

